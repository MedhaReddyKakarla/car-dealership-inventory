services:
  postgres:
    image: postgres:16
    container_name: car-dealership-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: car_dealership
      POSTGRES_USER: car_user
      POSTGRES_PASSWORD: car_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: